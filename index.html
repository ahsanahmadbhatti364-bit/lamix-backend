<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent SMS and Ranges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK Modular v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyOW3nIcnzfD5AHImlc4jNy_ZtFH8Gy3Q",
            authDomain: "inquistor-suite.firebaseapp.com",
            databaseURL: "https://inquistor-suite-default-rtdb.firebaseio.com",
            projectId: "inquistor-suite",
            storageBucket: "inquistor-suite.firebasestorage.app",
            messagingSenderId: "467094887188",
            appId: "1:467094887188:web:1fe4f6ceef6b2d81e90001",
            measurementId: "G-3ZT0HGCPMP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans antialiased">

    <div class="max-w-7xl mx-auto px-4 py-6 space-y-5">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white border border-gray-200 rounded-lg p-4 shadow-sm gap-3">
            <div>
                <h1 class="text-lg font-bold text-gray-900 tracking-tight">Recent SMS and Ranges</h1>
                <p class="text-xs text-gray-500">Real-time synchronized tracking dashboard.</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-medium bg-green-50 text-green-700 border border-green-200">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Live
                </span>
                <button onclick="fetchCDRs()" class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 px-3 py-1.5 rounded text-xs font-medium transition shadow-sm">
                    Refresh
                </button>
                <button onclick="resetAllTracking()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-1.5 rounded text-xs font-medium transition">
                    Reset All Tracking
                </button>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            
            <!-- Section 1: Recent Ranges & Pagination -->
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm flex flex-col">
                <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-xs font-bold text-gray-700 uppercase tracking-wider">Ranges List</h2>
                    <div class="flex items-center gap-2">
                        <button onclick="changePage(-1)" class="px-2 py-1 bg-white border border-gray-300 rounded text-xs hover:bg-gray-50">&larr; Prev</button>
                        <span id="page-indicator" class="text-xs text-gray-600 font-medium">Offset: 0</span>
                        <button onclick="changePage(1)" class="px-2 py-1 bg-white border border-gray-300 rounded text-xs hover:bg-gray-50">Next &rarr;</button>
                    </div>
                </div>
                <div class="overflow-x-auto min-h-[400px] max-h-[500px] overflow-y-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-50 text-gray-500 uppercase font-semibold sticky top-0 border-b border-gray-100">
                            <tr>
                                <th class="px-3 py-2.5">Time / Number</th>
                                <th class="px-3 py-2.5">CLI & Range</th>
                                <th class="px-3 py-2.5 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ranges-table-body" class="divide-y divide-gray-100">
                            <tr><td colspan="3" class="text-center py-10 text-gray-400">Loading numbers...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Section 2: Report Section -->
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm flex flex-col">
                <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-xs font-bold text-gray-700 uppercase tracking-wider">Report Section</h2>
                    <span id="tracked-count" class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200">0 Tracked</span>
                </div>
                <div class="overflow-x-auto min-h-[400px] max-h-[500px] overflow-y-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-50 text-gray-500 uppercase font-semibold sticky top-0 border-b border-gray-100">
                            <tr>
                                <th class="px-3 py-2.5">Copied Number</th>
                                <th class="px-3 py-2.5">Incoming CLI</th>
                                <th class="px-3 py-2.5">Range Name</th>
                                <th class="px-3 py-2.5">Received Time</th>
                            </tr>
                        </thead>
                        <tbody id="report-table-body" class="divide-y divide-gray-100">
                            <tr>
                                <td colspan="4" class="text-center py-10 text-gray-400 text-xs">Waiting for new messages on copied numbers...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        let allRowsData = [];
        let trackedMap = {};
        let currentOffset = 0;
        const limit = 25;
        const BACKEND_URL = "https://lamix-backend-51vs.onrender.com";

        // Setup Firebase Listener safely in background
        function initFirebase() {
            const checkInterval = setInterval(() => {
                if (window.db && window.ref && window.onValue) {
                    clearInterval(checkInterval);
                    const trackedRef = window.ref(window.db, 'shared_tracked_map');
                    window.onValue(trackedRef, (snapshot) => {
                        trackedMap = snapshot.val() || {};
                        if (allRowsData.length > 0) {
                            renderRanges(allRowsData);
                            checkReports(allRowsData);
                        }
                    });
                }
            }, 200);
        }
        initFirebase();

        window.fetchCDRs = async function() {
            try {
                const url = `${BACKEND_URL}/api/get-cdrs?limit=${limit}&offset=${currentOffset}`;
                const res = await fetch(url);
                const data = await res.json();
                
                // Handle different response structures gracefully
                if (data && data.rows) {
                    allRowsData = data.rows;
                } else if (Array.isArray(data)) {
                    allRowsData = data;
                } else if (data && data.data) {
                    allRowsData = data.data;
                } else {
                    allRowsData = [];
                }

                renderRanges(allRowsData);
                checkReports(allRowsData);
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('ranges-table-body').innerHTML = `<tr><td colspan="3" class="text-center py-10 text-red-400">Failed to load data from server.</td></tr>`;
            }
        }

        window.changePage = function(direction) {
            currentOffset += direction * limit;
            if (currentOffset < 0) currentOffset = 0;
            document.getElementById('page-indicator').innerText = `Offset: ${currentOffset}`;
            window.fetchCDRs();
        }

        function formatISTTime(dateString) {
            return new Date(dateString).toLocaleTimeString('en-IN', {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }

        function renderRanges(rows) {
            const tbody = document.getElementById('ranges-table-body');
            tbody.innerHTML = '';

            if(!rows || rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-10 text-gray-400">No numbers found.</td></tr>`;
                return;
            }

            rows.forEach((row, index) => {
                const isTracked = trackedMap.hasOwnProperty(row.receivedNumber);
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-3 py-2.5">
                            <div class="font-mono font-medium text-gray-900">${row.receivedNumber}</div>
                            <div class="text-[10px] text-gray-400">${formatISTTime(row.receivedAt)}</div>
                        </td>
                        <td class="px-3 py-2.5">
                            <div class="text-gray-800 font-medium">${row.senderCli}</div>
                            <div class="text-[10px] text-gray-400">${row.rangeName}</div>
                        </td>
                        <td class="px-3 py-2.5 text-right space-x-1">
                            <button id="copy-btn-${index}" onclick="copyNumber('${row.receivedNumber}', ${index})" 
                                class="px-2.5 py-1 rounded text-[11px] font-medium border transition ${isTracked ? 'bg-green-50 text-green-700 border-green-300' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}">
                                ${isTracked ? '✓ Copied' : 'Copy'}
                            </button>
                            ${isTracked ? `<button onclick="resetSingleTracking('${row.receivedNumber}')" class="px-2 py-1 rounded text-[11px] font-medium bg-red-50 text-red-600 border border-red-200 hover:bg-red-100">Reset</button>` : ''}
                        </td>
                    </tr>
                `;
            });
        }

        window.copyNumber = async function(number, index) {
            try {
                await navigator.clipboard.writeText(number);
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = number;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
            }

            trackedMap[number] = Date.now();

            if (window.db && window.ref && window.set) {
                window.set(window.ref(window.db, 'shared_tracked_map'), trackedMap);
            }

            renderRanges(allRowsData);
            checkReports(allRowsData);
        }

        window.resetSingleTracking = async function(number) {
            delete trackedMap[number];
            if (window.db && window.ref && window.set) {
                window.set(window.ref(window.db, 'shared_tracked_map'), trackedMap);
            }
            renderRanges(allRowsData);
            checkReports(allRowsData);
        }

        window.resetAllTracking = async function() {
            if (confirm("Reset tracking for all numbers?")) {
                trackedMap = {};
                if (window.db && window.ref && window.set) {
                    window.set(window.ref(window.db, 'shared_tracked_map'), null);
                }
                renderRanges(allRowsData);
                checkReports(allRowsData);
            }
        }

        function checkReports(rows) {
            const reportTbody = document.getElementById('report-table-body');
            const trackedCountEl = document.getElementById('tracked-count');
            
            const trackedKeys = Object.keys(trackedMap);
            trackedCountEl.innerText = `${trackedKeys.length} Tracked`;

            const matchedReports = [];
            rows.forEach(row => {
                if (trackedMap.hasOwnProperty(row.receivedNumber)) {
                    const copyTime = trackedMap[row.receivedNumber];
                    const msgTime = new Date(row.receivedAt).getTime();
                    if (msgTime > copyTime) {
                        matchedReports.push(row);
                    }
                }
            });

            if (matchedReports.length === 0) {
                reportTbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-gray-400 text-xs">Waiting for new messages on copied numbers...</td></tr>`;
                return;
            }

            reportTbody.innerHTML = '';
            matchedReports.forEach(row => {
                reportTbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition bg-green-50/20">
                        <td class="px-3 py-2.5 font-mono font-semibold text-green-800">${row.receivedNumber}</td>
                        <td class="px-3 py-2.5 font-medium text-gray-800">${row.senderCli}</td>
                        <td class="px-3 py-2.5 text-gray-600 text-[11px]">${row.rangeName}</td>
                        <td class="px-3 py-2.5 text-green-700 font-mono text-[11px]">${formatISTTime(row.receivedAt)}</td>
                    </tr>
                `;
            });
        }

        // Initial fetch and auto-refresh every 5 seconds
        fetchCDRs();
        setInterval(fetchCDRs, 5000);
    </script>
</body>
</html>
