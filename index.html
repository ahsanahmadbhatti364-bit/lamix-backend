<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamix SMS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK Modular v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyOW3nIcnzfD5AHImlc4jNy_ZtFH8Gy3Q",
            authDomain: "inquistor-suite.firebaseapp.com",
            databaseURL: "https://inquistor-suite-default-rtdb.firebaseio.com",
            projectId: "inquistor-suite",
            storageBucket: "inquistor-suite.firebasestorage.app",
            messagingSenderId: "467094887188",
            appId: "1:467094887188:web:1fe4f6ceef6b2d81e90001",
            measurementId: "G-3ZT0HGCPMP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans text-xs">

    <div class="max-w-7xl mx-auto px-3 py-4 space-y-4">
        <!-- Header like Lamix Panel -->
        <header class="bg-white border border-gray-300 rounded shadow-sm p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-sm font-bold text-gray-900">Lamix SMS Dashboard</h1>
                <p class="text-[11px] text-gray-500">Messages received on the test numbers.</p>
            </div>
            <div class="flex items-center gap-2">
                <button class="px-2.5 py-1 bg-blue-600 text-white font-semibold rounded text-[11px] shadow-sm">SMS Test Report</button>
                <button class="px-2.5 py-1 bg-white text-gray-700 border border-gray-300 font-medium rounded text-[11px] hover:bg-gray-50">SMS Test Numbers</button>
                <button onclick="fetchCDRs()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded font-medium transition flex items-center gap-1 shadow-sm">
                    ↻ Refresh
                </button>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            
            <!-- Section 1: Recent Inbound Ranges List (SMS Test Numbers view) -->
            <div class="bg-white border border-gray-300 rounded shadow-sm flex flex-col">
                <div class="px-3 py-2 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 class="font-bold text-gray-700 uppercase">Recent Inbound</h2>
                    <div class="flex items-center gap-2">
                        <button onclick="changePage(-1)" class="px-2 py-0.5 bg-white border border-gray-300 rounded hover:bg-gray-50">&larr; Prev</button>
                        <span id="page-indicator" class="text-gray-600 font-medium">Offset: 0</span>
                        <button onclick="changePage(1)" class="px-2 py-0.5 bg-white border border-gray-300 rounded hover:bg-gray-50">Next &rarr;</button>
                    </div>
                </div>
                <div class="overflow-x-auto min-h-[380px] max-h-[480px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-100 text-gray-600 uppercase font-semibold sticky top-0 border-b border-gray-300">
                            <tr>
                                <th class="px-2 py-2 border-r border-gray-200">Date / Number</th>
                                <th class="px-2 py-2 border-r border-gray-200">Range</th>
                                <th class="px-2 py-2 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="ranges-table-body" class="divide-y divide-gray-200">
                            <tr><td colspan="3" class="text-center py-10 text-gray-400">Loading numbers...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Section 2: Report Section (SMS Test Report view) -->
            <div class="bg-white border border-gray-300 rounded shadow-sm flex flex-col">
                <div class="px-3 py-2 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 class="font-bold text-gray-700 uppercase">Report</h2>
                    <span id="tracked-count" class="font-semibold px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200">0 Reports</span>
                </div>
                <div class="overflow-x-auto min-h-[380px] max-h-[480px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-100 text-gray-600 uppercase font-semibold sticky top-0 border-b border-gray-300">
                            <tr>
                                <th class="px-2 py-2 border-r border-gray-200">Copied Number</th>
                                <th class="px-2 py-2 border-r border-gray-200">Incoming CLI</th>
                                <th class="px-2 py-2 border-r border-gray-200">Range Name</th>
                                <th class="px-2 py-2">Received Time</th>
                            </tr>
                        </thead>
                        <tbody id="report-table-body" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="4" class="text-center py-10 text-gray-400">Waiting for new messages on copied numbers...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        let allRowsData = [];
        let currentOffset = 0;
        let globalReportsMap = {};
        const limit = 25;
        const BACKEND_URL = "https://lamix-backend-51vs.onrender.com";

        let trackedMap = {};
        try {
            const localSaved = localStorage.getItem('lamix_personal_tracked_v3');
            if (localSaved) {
                trackedMap = JSON.parse(localSaved);
            }
        } catch(e) {
            console.error(e);
        }

        function initFirebase() {
            const checkInterval = setInterval(() => {
                if (window.db && window.ref && window.onValue) {
                    clearInterval(checkInterval);
                    const reportsRef = window.ref(window.db, 'global_permanent_reports_v3');
                    window.onValue(reportsRef, (snapshot) => {
                        globalReportsMap = snapshot.val() || {};
                        renderReports();
                    });
                }
            }, 200);
        }
        initFirebase();

        window.fetchCDRs = async function() {
            try {
                const url = `${BACKEND_URL}/api/get-cdrs?limit=${limit}&offset=${currentOffset}`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data && data.rows) {
                    allRowsData = data.rows;
                } else if (Array.isArray(data)) {
                    allRowsData = data;
                } else if (data && data.data) {
                    allRowsData = data.data;
                } else {
                    allRowsData = [];
                }

                renderRanges(allRowsData);
                checkForNewMatches(allRowsData);
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('ranges-table-body').innerHTML = `<tr><td colspan="3" class="text-center py-10 text-red-400">Failed to load data from server.</td></tr>`;
            }
        }

        window.changePage = function(direction) {
            currentOffset += direction * limit;
            if (currentOffset < 0) currentOffset = 0;
            document.getElementById('page-indicator').innerText = `Offset: ${currentOffset}`;
            window.fetchCDRs();
        }

        function formatISTTime(dateString) {
            return new Date(dateString).toLocaleTimeString('en-IN', {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }

        function renderRanges(rows) {
            const tbody = document.getElementById('ranges-table-body');
            tbody.innerHTML = '';

            if(!rows || rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-10 text-gray-400">No numbers found.</td></tr>`;
                return;
            }

            rows.forEach((row, index) => {
                const rowKey = `${row.receivedNumber}_${row.receivedAt}`;
                const isTracked = trackedMap.hasOwnProperty(rowKey);

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-2 py-2 border-r border-gray-200">
                            <div class="font-mono font-semibold text-gray-900">${row.receivedNumber}</div>
                            <div class="text-[10px] text-gray-500">${formatISTTime(row.receivedAt)}</div>
                        </td>
                        <td class="px-2 py-2 border-r border-gray-200">
                            <div class="text-gray-800 font-medium">${row.rangeName || 'N/A'}</div>
                            <div class="text-[10px] text-gray-500">CLI: ${row.senderCli}</div>
                        </td>
                        <td class="px-2 py-2 text-right">
                            <button onclick="toggleTrack('${rowKey}', '${row.receivedNumber}')" 
                                class="px-2.5 py-1 rounded text-[11px] font-medium border transition ${isTracked ? 'bg-green-600 text-white border-green-700' : 'bg-blue-600 text-white border-blue-700 hover:bg-blue-700'}">
                                ${isTracked ? '✓ Tracked' : 'Copy'}
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        window.toggleTrack = async function(rowKey, number) {
            try {
                await navigator.clipboard.writeText(number);
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = number;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
            }

            if (trackedMap.hasOwnProperty(rowKey)) {
                delete trackedMap[rowKey];
            } else {
                trackedMap[rowKey] = Date.now();
            }

            localStorage.setItem('lamix_personal_tracked_v3', JSON.stringify(trackedMap));
            renderRanges(allRowsData);
            checkForNewMatches(allRowsData);
        }

        function checkForNewMatches(rows) {
            rows.forEach(row => {
                const rowKey = `${row.receivedNumber}_${row.receivedAt}`;
                if (trackedMap.hasOwnProperty(rowKey)) {
                    const copyTime = trackedMap[rowKey];
                    const msgTime = new Date(row.receivedAt).getTime();
                    if (msgTime > copyTime) {
                        const reportId = `${row.receivedNumber}_${msgTime}`.replace(/[\.#$\/\[\]]/g, '_');
                        if (!globalReportsMap[reportId] && window.db && window.ref && window.set) {
                            const reportData = {
                                receivedNumber: row.receivedNumber,
                                senderCli: row.senderCli,
                                rangeName: row.rangeName || 'N/A',
                                receivedAt: row.receivedAt
                            };
                            window.set(window.ref(window.db, `global_permanent_reports_v3/${reportId}`), reportData);
                        }
                    }
                }
            });
        }

        function renderReports() {
            const reportTbody = document.getElementById('report-table-body');
            const trackedCountEl = document.getElementById('tracked-count');
            
            const reportsArray = Object.values(globalReportsMap);
            trackedCountEl.innerText = `${reportsArray.length} Reports`;

            if (reportsArray.length === 0) {
                reportTbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-gray-400">Waiting for new messages on copied numbers...</td></tr>`;
                return;
            }

            reportTbody.innerHTML = '';
            reportsArray.sort((a, b) => new Date(b.receivedAt) - new Date(a.receivedAt));

            reportsArray.forEach(row => {
                reportTbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition bg-green-50/20">
                        <td class="px-2 py-2 border-r border-gray-200 font-mono font-semibold text-green-800">${row.receivedNumber}</td>
                        <td class="px-2 py-2 border-r border-gray-200 font-medium text-gray-800">${row.senderCli}</td>
                        <td class="px-2 py-2 border-r border-gray-200 text-gray-600 text-[11px]">${row.rangeName}</td>
                        <td class="px-2 py-2 text-green-700 font-mono text-[11px]">${formatISTTime(row.receivedAt)}</td>
                    </tr>
                `;
            });
        }

        fetchCDRs();
        setInterval(fetchCDRs, 5000);
    </script>
</body>
</html>
